_target_: model.simplefold.SimpleFold
ema_decay: 0.999
clip_grad_norm_val: 2.0
use_rigid_align: True
smooth_lddt_loss_weight: 1.0
lddt_cutoff: 15.0
esm_model: "esm2_3B"
lddt_weight_schedule: False
sample_dir: ${paths.sample_dir}
polyreact:
  enabled: false
  weights: "src/hfs-polyreactivity/artifacts/model.joblib"  # path to joblib artifact
  backend: null           # descriptors|plm|concat (null → artifact default)
  plm_model: null         # e.g. facebook/esm1v_t33_650M_UR90S_1
  heavy_only: true        # use only VH when sequences are colon-separated VH:VL
  cache_dir: null         # PLM cache dir if using PLM

  # AbMelt thermostability guidance (inference-time scoring + optional training-time steering)
abmelt:
  enabled: false                    # enable AbMelt scoring sidecar during predict/inference
  weights: "src/hfs-abmelt/artifacts/model.joblib"  # path to trained AbMelt artifact
  endpoint: "tm"                  # which endpoint to use: tagg | tm_on | tm
  target_direction: "maximize"     # desired direction for guidance: maximize|minimize
  score_sidecar: true               # write JSON next to structures with AbMelt scores
  # Training-time steering (requires labels or a learned surrogate head)
  loss_weight: 0.0                  # >0.0 to add AbMelt-guided auxiliary loss
  weight_schedule: false            # when true, upweight near clean data (mirrors LDDT schedule)
  desired_min: null                 # optional lower bound target (e.g., Tm >= 65 C)
  desired_max: null                 # optional upper bound target

architecture:
  esm_model: ${model.esm_model}

path: 
  _target_: model.flow.LinearPath

loss:
  _target_: torch.nn.MSELoss
  reduction: 'none'
  reduce: False

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0
  max_steps: ???

scheduler:
  _target_: utils.lr_scheduler.LinearWarmup
  _partial_: true
  min_lr: 1e-6
  max_lr: ${model.optimizer.lr}
  warmup_steps: 10

processor:
  scale: 16.0
  ref_scale: 5.0
  multiplicity: 16