# @package _global_
defaults:
  - data: test
  - model/architecture: foldingdit_100M
  - model/sampler: euler_maruyama
  - model: simplefold
  - model/processor: protein_processor
  - compute: local
  - callbacks: default
  - logger: null # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - _self_
  - experiment: null

# Mirror CLI flags with Hydra access: enable polyreact during evaluation/prediction
model:
  polyreact:
    enabled: false
    weights: "src/hfs-polyreactivity/artifacts/model.joblib"
    backend: null
    plm_model: null
    heavy_only: true
    cache_dir: null