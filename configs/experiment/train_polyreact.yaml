# @package _global_

# Integrate polyreactivity scoring guidance during training/evaluation.

defaults:
  - override /data: pdb
  - override /model: simplefold
  - override /model/architecture: foldingdit_100M
  - override /model/sampler: euler_maruyama
  - override /model/processor: protein_processor
  - override /callbacks: default
  - override /trainer: default
  - override /logger: tensorboard

seed: 12345

trainer:
  max_steps: 10000
  val_check_interval: 1000
  accumulate_grad_batches: 1

data:
  batch_size: 2
  num_workers: 8

model:
  _target_: model.simplefold.SimpleFold
  ema_decay: 0.999
  clip_grad_norm_val: 2.0
  esm_model: "esm2_3B"

  # Enable polyreactivity scoring at predict time
  polyreact:
    enabled: true
    weights: "src/hfs-polyreactivity/artifacts/model.joblib"
    backend: null         # descriptors|plm|concat (null → use artifact)
    plm_model: null       # e.g. facebook/esm1v_t33_650M_UR90S_1
    heavy_only: true
    cache_dir: null

  scheduler:
    _target_: utils.lr_scheduler.LinearWarmup
    _partial_: true
    min_lr: 1e-6
    max_lr: ${model.optimizer.lr}
    warmup_steps: 5000

  architecture:
    esm_model: ${model.esm_model}

  sampler:
    num_timesteps: 150
    tau: 0.3

  processor:
    scale: 16.0
    ref_scale: 5.0
    multiplicity: 8


